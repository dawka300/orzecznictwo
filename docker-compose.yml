# Lokalna MariaDB do pracy i testów (na hostingu jest MariaDB hostingu).
# Wersję warto ustawić taką jak na seohost (sprawdzić w panelu: SELECT VERSION()).
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: szkielet
      MARIADB_PASSWORD: szkielet
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Bufor InnoDB: domyślne 128 MB to za mało dla ~10 GB ETPC (wyszukiwanie
    # pełnotekstowe czytało z dysku: "court" 45 s). Na hostingu ustawia hosting.
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=4G"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  # Baza wektorowa do wyszukiwania semantycznego (tylko lokalnie; na hostingu
  # jej nie ma). REST na 6333, panel: http://127.0.0.1:6333/dashboard
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

volumes:
  dbdata:
  qdrantdata:
