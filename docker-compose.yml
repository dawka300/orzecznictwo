# Lokalna MariaDB do pracy i testów (na hostingu jest MariaDB hostingu).
# Wersję warto ustawić taką jak na seohost (sprawdzić w panelu: SELECT VERSION()).
#
# Profile pamięci: ten plik = profil użytkownika (komputer z 32 GB RAM, Docker/WSL
# ~22 GB). Profil deweloperski (64 GB) nadpisuje różnice w docker-compose.dev.yml;
# włącza go linia w .env: COMPOSE_FILE=docker-compose.yml;docker-compose.dev.yml
# Zmiana profilu zmienia "command" bazy -> `docker compose up -d db` odtworzy kontener
# bazy (przerywa przebiegi): przełączać świadomie, polecenia zadań zawsze z --no-deps.
services:
  db:
    image: mariadb:10.11
    # Wstaje sam razem z dockerem (bez ręcznego docker compose up).
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: szkielet
      MARIADB_PASSWORD: szkielet
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Bufor InnoDB (profil użytkownika 3G): po przejściu wyszukiwania po słowach do
    # Elasticsearch baza oddaje głównie wiersze po id i metadane - odczyt z dysku M.2
    # to milisekundy. Do tego czasu FULLTEXT poza buforem bywa bardzo wolny (ETPC
    # hybryda ~61 s przy 4G, ~0,6 s przy 8G) - profil dev ma 8G. Na hostingu ustawia hosting.
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=3G"
      - "--innodb-io-capacity=2000"
      - "--innodb-io-capacity-max=4000"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  # Baza wektorowa do wyszukiwania semantycznego (tylko lokalnie; na hostingu
  # jej nie ma). REST na 6333, panel: http://127.0.0.1:6333/dashboard
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

  # Wszystkie wyszukiwarki na http://127.0.0.1:8080 (python -m portal w kontenerze):
  # /etpc/ i /nsa/ - każda z własną wyszukiwarką i statystykami, / - lista.
  # Wektor zapytania liczy model w kontenerze (bge-m3 na CPU, ~2.3 GB RAM, jeden
  # dla obu projektów, cache w wolumenie hfcache); bez niego LM Studio na
  # komputerze (host.docker.internal); bez obu strony działają na pełnotekstowym.
  www:
    build:
      context: .
      dockerfile: docker/www.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "portal", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
      - hfcache:/root/.cache/huggingface
    environment:
      ETPC_DB_DSN: mysql://szkielet:szkielet@db:3306/etpc
      ETPC_QDRANT_URL: http://qdrant:6333
      ETPC_EMBED_URL: http://host.docker.internal:1234/v1/embeddings
      ETPC_CHAT_URL: http://host.docker.internal:1234/v1/chat/completions
      ETPC_LOG_DIR: logs/www
      NSA_DB_DSN: mysql://szkielet:szkielet@db:3306/nsa
      NSA_QDRANT_URL: http://qdrant:6333
      NSA_EMBED_URL: http://host.docker.internal:1234/v1/embeddings
      NSA_CHAT_URL: http://host.docker.internal:1234/v1/chat/completions
      NSA_LOG_DIR: logs/www
      # dev / prod (z .env; wybiera też plik docker-compose.<APP_ENV>.yml przez COMPOSE_FILE)
      APP_ENV: ${APP_ENV:-prod}
      PORTAL_LOG_DIR: logs/www
      # kopia bazy z kontenera: mariadb-dump z obrazu łączy się z db (host z DSN);
      # wygrywa z ETPC_DUMP_COMMAND z .env (docker exec - w kontenerze nie ma dockera)
      # (--skip-ssl: klient 11.8 bez tego ostrzega przy każdej kopii; sieć lokalna)
      # przetworz: teksty porcji czytane naraz kilkoma połączeniami
      # (judgments_core.db.RawReader); profil dev: 4
      ETPC_READ_CONNECTIONS: "2"
      NSA_READ_CONNECTIONS: "2"
      ETPC_DUMP_COMMAND: mariadb-dump --skip-ssl
      NSA_DUMP_COMMAND: mariadb-dump --skip-ssl
      PROXY_SELLER_API_KEY: ${PROXY_SELLER_API_KEY:-}
      # testy (docker compose run --rm www python -m pytest): tylko baza robocza
      TEST_DB_DSN: mysql://szkielet:szkielet@db:3306/szkielet_test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  dbdata:
  qdrantdata:
  hfcache:
